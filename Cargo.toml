[package]
name = "ncoxide"
version = "0.5.0"
edition = "2024"
description = "Modal dual-pane file commander with helix-inspired interface"
license = "MIT"
authors = ["Dan Probst <dan@probst.dev>"]
repository = "https://github.com/theHausdorffMetric/ncoxide"
homepage = "https://github.com/theHausdorffMetric/ncoxide"
readme = "README.md"
keywords = ["file-manager", "tui", "terminal", "dual-pane", "helix"]
categories = ["command-line-utilities", "filesystem"]
rust-version = "1.98"
include = ["src/**", "/README.md", "/LICENSE"]

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "1.0"
clap = { version = "4", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }
walkdir = "2"
dirs = "6"
log = "0.4"
fern = "0.7"
libc = "0.2"
unicode-width = "0.2"
nucleo-matcher = "0.3"
syntect = { version = "5", default-features = false, features = ["parsing", "regex-fancy", "default-themes", "default-syntaxes"] }
regex = "1"
memchr = "2"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "qoi"] }
