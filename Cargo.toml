[package]
name = "ncoxide"
version = "0.2.0"
edition = "2024"
description = "Modal dual-pane file commander with helix-inspired interface"
license = "MIT"
authors = ["Dan Probst <dan@probst.dev>"]
repository = "https://git.sr.ht/~danprobst/ncoxide"
homepage = "https://git.sr.ht/~danprobst/ncoxide"
readme = "README.md"
keywords = ["file-manager", "tui", "terminal", "dual-pane", "helix"]
categories = ["command-line-utilities", "filesystem"]
rust-version = "1.85"
exclude = [".claude/"]

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.29", features = ["event-stream"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "1.0"
clap = { version = "4", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }
walkdir = "2"
dirs = "6"
log = "0.4"
fern = "0.7"
libc = "0.2"
unicode-width = "0.2"
nucleo-matcher = "0.3"
syntect = { version = "5", default-features = false, features = ["parsing", "regex-fancy", "default-themes"] }
syntect-tui = "3"
